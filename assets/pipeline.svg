<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img"
     aria-label="How the corpus reaches the engine: this repository serves a hash-verified corpus pack; the public engine repository fetches and verifies it, then research can run offline.">
  <defs>
    <style>
      .panel{fill:#ffffff;stroke:#ded9d1;stroke-width:1}
      .public{fill:#f2f7f3;stroke:#3f6b4a;stroke-width:1.5}
      .corpus{fill:#fffdf6;stroke:#8a6d1f;stroke-width:1.5}
      .ink{fill:#1c1b19} .ink2{fill:#43403b} .ink3{fill:#6f6a62}
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
      .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
      .h{font-size:14.5px;font-weight:600} .s{font-size:11.5px} .xs{font-size:10.5px}
      .arrow{stroke:#c9c3b8;stroke-width:1.5;fill:none}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9c3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="340" fill="#f7f6f3"/>

  <rect class="corpus" x="24" y="60" width="252" height="132" rx="8"/>
  <text class="t h ink" x="42" y="88">This repository (corpus)</text>
  <text class="t s ink3" x="42" y="110">release asset</text>
  <text class="t mono xs ink2" x="42" y="130">corpus-pack-v1.tar.gz</text>
  <text class="t mono xs ink2" x="42" y="148">215.7 MB · 2,078 files</text>
  <text class="t s ink3" x="42" y="170">+ corpus-pack-v1.manifest.json</text>
  <text class="t xs" x="42" y="186" fill="#8a6d1f">per-file sha256 · tamper-evident</text>

  <path class="arrow" d="M276 126 H 356" marker-end="url(#m)"/>
  <text class="t xs ink3" x="282" y="116">download</text>

  <rect class="public" x="356" y="60" width="272" height="132" rx="8"/>
  <text class="t h ink" x="374" y="88">Engine repository (public)</text>
  <text class="t mono xs ink2" x="374" y="110">tools/fetch-corpus.py</text>
  <text class="t s ink3" x="374" y="130">verifies the pack hash, then every</text>
  <text class="t s ink3" x="374" y="148">file hash — refuses on any mismatch</text>
  <text class="t mono xs ink2" x="374" y="170">core_freeze.py --verify</text>
  <text class="t xs" x="374" y="186" fill="#3f6b4a">→ SCHOLARLY_CORE_READY</text>

  <path class="arrow" d="M628 126 H 708" marker-end="url(#m)"/>
  <text class="t xs ink3" x="640" y="116">install</text>

  <rect class="panel" x="708" y="60" width="268" height="132" rx="8"/>
  <text class="t h ink" x="726" y="88">Your machine (offline)</text>
  <text class="t s ink3" x="726" y="110">passage store · witnesses · ontology</text>
  <text class="t s ink3" x="726" y="130">lexical + vector indexes</text>
  <text class="t mono xs ink2" x="726" y="152">python3 -m workspace_ui.server.cli</text>
  <text class="t s ink3" x="726" y="174">research runs locally; nothing is uploaded</text>

  <line x1="24" y1="216" x2="976" y2="216" stroke="#ded9d1"/>
  <text class="t s ink" x="24" y="242">The engine contains no source text; this repository contains no engine code. Keeping them apart is what lets the code be Apache-2.0 while the texts stay third-party.</text>
  <text class="t xs ink3" x="24" y="264">Verified on a clean install: 8/8 layers READY · a Seminar XI run returning VALIDATED_WITH_QUALIFICATIONS with 3 claims and 3 citations · 249,105 passages browsable in Explore.</text>
  <text class="t mono xs" x="24" y="292">Hashes: sha256(corpus-pack-v1.tar.gz) + 2,078 per-file hashes, published in the manifest next to the pack.</text>
  <text class="t xs" x="24" y="316" fill="#8a6d1f">Rights: see RIGHTS.md and the warning at the top of this page. Research and study only — no commercial use, no redistribution.</text>
</svg>
